  <text x="65" y="138" fill="#38bdf8" font-family="monospace" font-size="10">🐍 mukhya.py</text>
  <text x="65" y="160" fill="#94a3b8" font-family="monospace" font-size="10">📄 niti.json</text>
  <text x="65" y="182" fill="#94a3b8" font-family="monospace" font-size="10">📜 praman.txt</text>

  <!-- Code Editor Body -->
  <rect x="170" y="91" width="390" height="175" fill="#131b2e" />
  
  <!-- Editor Tab -->
  <rect x="170" y="91" width="120" height="24" fill="#1e293b" />
  <text x="230" y="107" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">mukhya.py 🇮🇳</text>

