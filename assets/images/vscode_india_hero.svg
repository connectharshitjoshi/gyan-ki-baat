  <text x="460" y="193" text-anchor="middle" fill="#22c55e" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">✓ 100% SWADESHI CERTIFIED</text>
  <text x="460" y="208" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">NIC MeghRaj Cloud • Tier-4</text>
  <text x="460" y="222" text-anchor="middle" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">डिजिटल मुहर (Digital Seal)</text>

