<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bgCanvas)"/>

  <!-- Blueprint Grid lines -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Header Title -->
  <text x="480" y="38" text-anchor="middle" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
    GRAPH ROUTING EVOLUTION: WHY DIJKSTRA FAILS &amp; CONTRACTION HIERARCHIES WIN
  </text>
  <text x="480" y="60" text-anchor="middle" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Comparing Search Spaces &amp; Explored Node Volumes across 1,000+ km Continental Road Networks
  </text>

  <!-- ==================== COLUMN 1: DIJKSTRA ==================== -->
  <rect x="25" y="80" width="285" height="375" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="25" y="80" width="285" height="38" rx="10" fill="#ef4444" fill-opacity="0.15"/>
  <text x="40" y="104" fill="#f87171" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">1. Dijkstra's Algorithm</text>
  <text x="290" y="104" text-anchor="end" fill="#f87171" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">~25,000,000 Nodes</text>

  <!-- Circular radial expansion -->
  <circle cx="167" cy="235" r="95" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="167" cy="235" r="65" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="167" cy="235" r="35" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Start & Target Nodes -->
  <circle cx="167" cy="235" r="6" fill="#38bdf8" filter="url(#glowCyan)"/>
  <text x="167" y="222" text-anchor="middle" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">Source (S)</text>

  <circle cx="235" cy="180" r="5" fill="#f59e0b" filter="url(#glowAmber)"/>
  <text x="235" y="170" text-anchor="middle" fill="#f59e0b" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">Target (T)</text>

  <!-- Radial Rays (wasted exploration) -->
  <line x1="167" y1="235" x2="85" y2="285" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="167" y1="235" x2="90" y2="185" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="167" y1="235" x2="167" y2="330" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="167" y1="235" x2="245" y2="295" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Details Card 1 -->
  <rect x="37" y="345" width="261" height="98" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="47" y="365" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">• Radial Uniform Wave Expansion</text>
  <text x="47" y="383" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Wastes 95% CPU searching wrong ways</text>
  <text x="47" y="401" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Query Latency: 5,000ms – 15,000ms</text>
  <text x="47" y="425" fill="#f87171" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">❌ Catastrophic for Web Scale</text>


  <!-- ==================== COLUMN 2: A* SEARCH ==================== -->
  <rect x="337" y="80" width="285" height="375" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="337" y="80" width="285" height="38" rx="10" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="352" y="104" fill="#fbbf24" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">2. A* Search (Heuristic)</text>
  <text x="602" y="104" text-anchor="end" fill="#fbbf24" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">~800,000 Nodes</text>

  <!-- Elliptical search envelope -->
  <ellipse cx="480" cy="225" rx="90" ry="50" transform="rotate(-20 480 225)" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <ellipse cx="480" cy="225" rx="60" ry="32" transform="rotate(-20 480 225)" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Start & Target Nodes -->
  <circle cx="410" cy="250" r="6" fill="#38bdf8" filter="url(#glowCyan)"/>
  <text x="410" y="272" text-anchor="middle" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">Source (S)</text>

  <circle cx="550" cy="200" r="6" fill="#10b981" filter="url(#glowGreen)"/>
  <text x="550" y="185" text-anchor="middle" fill="#10b981" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">Target (T)</text>

  <!-- Vector line towards goal -->
  <line x1="414" y1="248" x2="544" y2="202" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="480" y="210" text-anchor="middle" fill="#fde68a" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600">h(n) Euclidean Vector</text>

  <!-- Details Card 2 -->
  <rect x="349" y="345" width="261" height="98" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="359" y="365" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">• Directed f(n) = g(n) + h(n) Heuristic</text>
  <text x="359" y="383" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Still visits thousands of local alleys</text>
  <text x="359" y="401" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Query Latency: 500ms – 1,500ms</text>
  <text x="359" y="425" fill="#fbbf24" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">⚠️ Too Slow for 100k+ QPS</text>


  <!-- ==================== COLUMN 3: CONTRACTION HIERARCHIES ==================== -->
  <rect x="649" y="80" width="285" height="375" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8"/>
  <rect x="649" y="80" width="285" height="38" rx="10" fill="#10b981" fill-opacity="0.18"/>
  <text x="664" y="104" fill="#34d399" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">3. Contraction Hierarchies</text>
  <text x="914" y="104" text-anchor="end" fill="#34d399" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">&lt; 500 Nodes</text>

  <!-- Hierarchy Cone Structure -->
  <!-- Highway Core (Top) -->
  <polygon points="791,140 730,220 852,220" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <!-- Middle Arterials -->
  <polygon points="730,220 852,220 890,300 692,300" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Level labels -->
  <text x="791" y="160" text-anchor="middle" fill="#34d399" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">Highways &amp; Expressways</text>
  <text x="791" y="260" text-anchor="middle" fill="#93c5fd" font-family="'Inter', system-ui, sans-serif" font-size="10">Arterial Roads &amp; Shortcuts</text>
  <text x="791" y="325" text-anchor="middle" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="9.5">Local Streets &amp; Residential Alleys</text>

  <!-- Source upward ray -->
  <circle cx="715" cy="295" r="5" fill="#38bdf8" filter="url(#glowCyan)"/>
  <text x="700" y="312" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">S</text>

  <!-- Target upward ray -->
  <circle cx="865" cy="295" r="5" fill="#fbbf24" filter="url(#glowAmber)"/>
  <text x="875" y="312" fill="#fbbf24" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">T</text>

  <!-- Meeting point at the apex -->
  <circle cx="791" cy="142" r="6" fill="#10b981" filter="url(#glowGreen)"/>
  <text x="791" y="132" text-anchor="middle" fill="#34d399" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700">Apex Meeting Node</text>

  <!-- Connecting upward paths -->
  <path d="M715,295 Q740,210 791,142" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M865,295 Q840,210 791,142" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Details Card 3 -->
  <rect x="661" y="345" width="261" height="98" rx="6" fill="#0b1120" stroke="#059669" stroke-width="1.2"/>
  <text x="671" y="365" fill="#ecfdf5" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">• Bidirectional Upward Search</text>
  <text x="671" y="383" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Bypasses 99.9% of local roads</text>
  <text x="671" y="401" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="10.5">• Query Latency: &lt; 5ms (Sub-millisecond)</text>
  <text x="671" y="425" fill="#34d399" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">✅ Google Maps Production Standard</text>
</svg>
