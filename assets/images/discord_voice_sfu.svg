<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto">
  <defs>
    <linearGradient id="discordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>

    <linearGradient id="blurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#404EED"/>
    </linearGradient>

    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="elixirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="100%" stop-color="#111522"/>
    </linearGradient>

    <filter id="glowBlurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="440" fill="url(#discordBg)"/>

  <!-- Blueprint Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="320" y1="0" x2="320" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
  </g>

  <!-- Top Title Bar -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#blurpleGrad)" filter="url(#glowBlurple)"/>
    <path d="M 8 13 C 12 11, 22 11, 26 13 C 28 17, 27 23, 25 26 C 21 28, 13 28, 9 26 C 7 23, 6 17, 8 13 Z" fill="#ffffff"/>
    <circle cx="13" cy="18" r="2" fill="#5865F2"/>
    <circle cx="21" cy="18" r="2" fill="#5865F2"/>
    <text x="46" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="0.5">DISCORD REAL-TIME VOICE ARCHITECTURE</text>
    <text x="900" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12" text-anchor="end">WebRTC SFU + Elixir Signaling + Rust Media Core</text>
  </g>

  <!-- Flow Arrows (Behind Cards) -->
  <!-- Speaker to Signaling & SFU -->
  <path d="M 240 180 L 370 140" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 240 220 L 370 260" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowCyan)"/>

  <!-- SFU to Listeners -->
  <path d="M 610 260 L 730 180" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 610 270 L 730 270" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 610 280 L 730 360" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Left Node: Speaker Client -->
  <g transform="translate(40, 90)">
    <rect width="200" height="290" rx="14" fill="url(#cardGrad)" stroke="#5865F2" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="32" rx="6" fill="#1e2438"/>
    <text x="100" y="36" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" text-anchor="middle">🎙️ Speaker Client</text>
    
    <g transform="translate(15, 65)">
      <text x="0" y="16" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Opus Audio Codec</text>
      <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">20ms Audio Frames @ 64kbps</text>
      <rect x="0" y="42" width="170" height="2" fill="#334155"/>
    </g>

    <g transform="translate(15, 125)">
      <text x="0" y="16" fill="#a855f7" font-family="'Inter', sans-serif" font-weight="700" font-size="11">1. WebSocket Signaling</text>
      <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Elixir Gateway Protocol</text>
      <rect x="0" y="42" width="170" height="2" fill="#334155"/>
    </g>

    <g transform="translate(15, 185)">
      <text x="0" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="11">2. Direct UDP / RTP</text>
      <text x="0" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Zero TCP Retransmit Lag</text>
      <rect x="0" y="42" width="170" height="2" fill="#334155"/>
    </g>

    <rect x="15" y="242" width="170" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="262" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">⚡ Encrypted SRTP Audio</text>
  </g>

  <!-- Middle Top Node: Elixir Signaling Control Plane -->
  <g transform="translate(370, 80)">
    <rect width="240" height="110" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="12" width="210" height="26" rx="6" fill="#2e1065"/>
    <text x="120" y="29" fill="#c084fc" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">💧 Elixir Signaling (BEAM VM)</text>
    
    <g transform="translate(15, 48)">
      <text x="0" y="14" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• 1 Lightweight GenServer Process / User</text>
      <text x="0" y="30" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Handles Permissions, Mute, Deafen</text>
      <text x="0" y="46" fill="#a855f7" font-family="'Inter', sans-serif" font-size="10" font-weight="600">• Routes client to lowest-ping Voice Node</text>
    </g>
  </g>

  <!-- Middle Bottom Node: Rust WebRTC SFU Media Core (The Engine) -->
  <g transform="translate(370, 210)">
    <rect width="240" height="170" rx="14" fill="url(#cardGrad)" stroke="#f97316" stroke-width="2" filter="url(#glowBlurple)"/>
    <rect width="240" height="170" rx="14" fill="url(#cardGrad)"/>
    <rect x="15" y="12" width="210" height="28" rx="6" fill="#431407"/>
    <text x="120" y="30" fill="#fb923c" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" text-anchor="middle">🦀 Rust Media Core (SFU Server)</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="14" fill="#fde047" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Selective Forwarding Unit (SFU):</text>
      <text x="0" y="30" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Zero Audio Transcoding (Zero CPU bloat)</text>
      <text x="0" y="46" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Raw UDP Packet Replication in memory</text>
      <text x="0" y="62" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">• Zero Garbage Collection Pauses!</text>
      <rect x="0" y="74" width="210" height="28" rx="4" fill="#1e293b"/>
      <text x="105" y="92" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">🚀 Sub-5ms Packet Fan-out</text>
    </g>
  </g>

  <!-- Right Node: Multiple Listeners in Channel -->
  <g transform="translate(730, 90)">
    <rect width="190" height="290" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="32" rx="6" fill="#064e3b"/>
    <text x="95" y="36" fill="#6ee7b7" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" text-anchor="middle">🎧 Listeners (N Users)</text>
    
    <g transform="translate(15, 65)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">User #1 (Gamer A)</text>
      <text x="10" y="36" fill="#34d399" font-family="'Inter', sans-serif" font-size="9">RTP Stream: 8ms Ping</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">User #2 (Gamer B)</text>
      <text x="10" y="36" fill="#34d399" font-family="'Inter', sans-serif" font-size="9">RTP Stream: 11ms Ping</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="700">User #N (1,000+ Listeners)</text>
      <text x="10" y="36" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9">Stage Channel Scale</text>
    </g>

    <rect x="15" y="245" width="160" height="28" rx="4" fill="#065f46"/>
    <text x="95" y="263" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Zero Mesh Battery Drain</text>
  </g>

  <!-- Bottom Legend -->
  <text x="480" y="420" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Gyaan Ki Baat • By Harshit Joshi • Discord Low-Latency WebRTC SFU Pipeline</text>
</svg>
