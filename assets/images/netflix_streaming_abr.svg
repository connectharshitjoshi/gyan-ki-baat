<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bgABR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <linearGradient id="ladder4K" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="ladder1080" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="ladder720" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="ladder480" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgABR)"/>

  <!-- Title Bar -->
  <rect x="40" y="20" width="880" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="52" fill="#38bdf8" font-family="'Outfit', sans-serif" font-weight="700" font-size="16">🎬 DYNAMIC ADAPTIVE STREAMING OVER HTTP (DASH / HLS)</text>
  <text x="900" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="12" text-anchor="end">Client-Driven 2-Second Segment Slicing</text>

  <!-- Bitrate Ladder Section (Left) -->
  <g transform="translate(40, 90)">
    <rect width="360" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="14">Master Encoding Ladder (Manifest .mpd)</text>
    
    <!-- 4K Tier -->
    <g transform="translate(20, 50)">
      <rect width="320" height="55" rx="8" fill="url(#ladder4K)" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">4K Ultra HD (3840x2160)</text>
      <text x="15" y="44" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="11">Bitrate: 16.0 Mbps • Codec: AV1 / HEVC</text>
      <rect x="250" y="16" width="55" height="24" rx="4" fill="#065f46"/>
      <text x="277" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">50 Mbps+</text>
    </g>

    <!-- 1080p Tier -->
    <g transform="translate(20, 115)">
      <rect width="320" height="55" rx="8" fill="url(#ladder1080)" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="15" y="24" fill="#60a5fa" font-family="'Inter', sans-serif" font-weight="700" font-size="13">1080p Full HD (1920x1080)</text>
      <text x="15" y="44" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="11">Bitrate: 4.5 Mbps • Codec: H.264 / VP9</text>
      <rect x="250" y="16" width="55" height="24" rx="4" fill="#1e40af"/>
      <text x="277" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">10 Mbps</text>
    </g>

    <!-- 720p Tier -->
    <g transform="translate(20, 180)">
      <rect width="320" height="55" rx="8" fill="url(#ladder720)" fill-opacity="0.18" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="15" y="24" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="700" font-size="13">720p HD (1280x720)</text>
      <text x="15" y="44" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11">Bitrate: 2.2 Mbps • Codec: H.264</text>
      <rect x="250" y="16" width="55" height="24" rx="4" fill="#92400e"/>
      <text x="277" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">4 Mbps</text>
    </g>

    <!-- 480p Tier -->
    <g transform="translate(20, 245)">
      <rect width="320" height="55" rx="8" fill="url(#ladder480)" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.2"/>
      <text x="15" y="24" fill="#f87171" font-family="'Inter', sans-serif" font-weight="700" font-size="13">480p SD (854x480) - Fallback</text>
      <text x="15" y="44" fill="#fecaca" font-family="'Inter', sans-serif" font-size="11">Bitrate: 650 Kbps • Codec: H.264</text>
      <rect x="250" y="16" width="55" height="24" rx="4" fill="#991b1b"/>
      <text x="277" y="32" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">1.5 Mbps</text>
    </g>

    <text x="20" y="324" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">⚡ 1 Movie = ~1,200 chunks per resolution profile!</text>
  </g>

  <!-- Live Chunk Playback Timeline (Right) -->
  <g transform="translate(420, 90)">
    <rect width="500" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="14">Dynamic Seamless Bitrate Switching (Live Example)</text>

    <!-- Timeline Blocks -->
    <g transform="translate(20, 55)">
      <!-- Chunk 1 -->
      <rect x="0" y="0" width="105" height="75" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
      <text x="52" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Chunk #1 (0-2s)</text>
      <text x="52" y="42" fill="#6ee7b7" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">4K Ultra HD</text>
      <text x="52" y="62" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Fast Wi-Fi (60Mbps)</text>

      <!-- Chunk 2 -->
      <rect x="115" y="0" width="105" height="75" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
      <text x="167" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Chunk #2 (2-4s)</text>
      <text x="167" y="42" fill="#6ee7b7" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">4K Ultra HD</text>
      <text x="167" y="62" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Buffer Full (30s)</text>

      <!-- Chunk 3 (Wi-Fi Drops) -->
      <rect x="230" y="0" width="105" height="75" rx="6" fill="#92400e" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="282" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Chunk #3 (4-6s)</text>
      <text x="282" y="42" fill="#fde68a" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">720p HD</text>
      <text x="282" y="62" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">⚠️ Microwave/Congest</text>

      <!-- Chunk 4 (Recovery) -->
      <rect x="345" y="0" width="105" height="75" rx="6" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="397" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Chunk #4 (6-8s)</text>
      <text x="397" y="42" fill="#93c5fd" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle">1080p HD</text>
      <text x="397" y="62" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Speed Recovers</text>
    </g>

    <!-- Dev Explanation Box -->
    <rect x="20" y="150" width="460" height="150" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="12">🧠 Why You NEVER Experience a Spinning Spinner:</text>
    <text x="35" y="200" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">1. The video player maintains a 30-second forward lookahead buffer.</text>
    <text x="35" y="222" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">2. When throughput drops, player seamlessly requests the next 2s chunk</text>
    <text x="48" y="238" fill="#facc15" font-family="'Inter', sans-serif" font-size="11" font-weight="600">at 720p without restarting playback or interrupting audio!</text>
    <text x="35" y="262" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">3. Audio is encoded separately as constant high-bitrate AAC/Dolby Atmos.</text>
    <text x="35" y="285" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Result: Uninterrupted continuous audio + zero playback stutter.</text>
  </g>

  <!-- Watermark -->
  <text x="480" y="465" fill="#475569" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Gyaan Ki Baat #13 • Adaptive Bitrate Streaming (ABR) Engine Under The Hood</text>
</svg>
