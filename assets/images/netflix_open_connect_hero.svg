<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSleek" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Netflix Brand Red Gradient -->
    <linearGradient id="nflxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>

    <!-- AWS Glow Gradient -->
    <linearGradient id="awsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Fiber Glow Gradient -->
    <linearGradient id="fiberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Node Card Fill -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bgSleek)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="960" y2="70"/>
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="350" x2="960" y2="350"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
  </g>

  <!-- Top Brand Ribbon -->
  <g transform="translate(40, 20)">
    <!-- Netflix Official Logo Mark -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#e50914" filter="url(#neonRed)"/>
    <text x="17" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" text-anchor="middle">N</text>
    <text x="46" y="23" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="1">NETFLIX OPEN CONNECT</text>
    <text x="250" y="23" fill="#64748b" font-family="'Inter', sans-serif" font-weight="500" font-size="13">• Distributed Edge Infrastructure</text>
    <text x="880" y="23" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12" text-anchor="end">300+ Tbps Video Stream</text>
  </g>

  <!-- Connecting Pipes / Fiber Streams Behind Nodes -->
  <!-- Pipe 1: User to AWS Control Plane (Metadata) -->
  <path d="M 180 180 C 180 120, 360 110, 480 110" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
  
  <!-- Pipe 2: AWS to Local ISP (Pre-warming & Steering) -->
  <path d="M 680 110 C 780 110, 780 220, 780 260" fill="none" stroke="#e50914" stroke-width="2.5" opacity="0.9"/>

  <!-- Pipe 3: High-Speed Direct Fiber from OCA to User (4K Video stream) -->
  <path d="M 660 300 C 440 300, 320 280, 200 240" fill="none" stroke="url(#fiberCyan)" stroke-width="4" filter="url(#neonCyan)"/>

  <!-- Node 1: Client / Smart TV (Left) -->
  <g transform="translate(40, 120)">
    <rect width="200" height="230" rx="12" fill="url(#nodeBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="30" rx="6" fill="#1e293b"/>
    <text x="100" y="35" fill="#f8fafc" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" text-anchor="middle">📺 Client Device</text>
    
    <g transform="translate(15, 60)">
      <circle cx="10" cy="10" r="4" fill="#ff9900"/>
      <text x="24" y="14" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">1. Requests Metadata</text>
      <text x="24" y="30" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">User auth &amp; .mpd manifest</text>
    </g>

    <g transform="translate(15, 110)">
      <circle cx="10" cy="10" r="4" fill="#38bdf8"/>
      <text x="24" y="14" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">2. Adaptive Player</text>
      <text x="24" y="30" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">4K Ultra HD (16 Mbps)</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="170" height="42" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <text x="85" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ Ultra Low Latency</text>
      <text x="85" y="32" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">&lt; 3ms Direct Fiber to ISP</text>
    </g>
  </g>

  <!-- Node 2: AWS Control Plane (Top Center/Right) -->
  <g transform="translate(380, 60)">
    <rect width="300" height="100" rx="12" fill="url(#nodeBg)" stroke="#d97706" stroke-width="1.5"/>
    <rect x="15" y="12" width="270" height="26" rx="6" fill="#1e293b"/>
    <text x="150" y="29" fill="#fbbf24" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">☁️ AWS: Control Plane (Zero Video Stream)</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">• User Auth, Billing &amp; Search</text>
      <text x="0" y="30" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">• Master Transcoding (EC2/S3)</text>
      <text x="160" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">• ML Recommendation</text>
      <text x="160" y="30" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600">• OCA Steering DNS</text>
    </g>
  </g>

  <!-- Node 3: Open Connect Appliance (OCA) inside Local ISP (Bottom Right) -->
  <g transform="translate(560, 200)">
    <rect width="360" height="180" rx="14" fill="url(#nodeBg)" stroke="#e50914" stroke-width="2" filter="url(#neonRed)"/>
    <rect width="360" height="180" rx="14" fill="url(#nodeBg)"/>
    <rect x="15" y="15" width="330" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="35" fill="#ef4444" font-family="'Outfit', sans-serif" font-weight="800" font-size="13">🔥 Open Connect (OCA) inside Local ISP</text>
    
    <!-- Specs Grid -->
    <g transform="translate(15, 55)">
      <rect width="155" height="50" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#f87171" font-family="'Inter', sans-serif" font-weight="700" font-size="10">FreeBSD + NGINX</text>
      <text x="10" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Zero-copy sendfile()</text>

      <rect x="175" y="0" width="155" height="50" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1"/>
      <text x="185" y="20" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="10">100Gbps+ Flash NVMe</text>
      <text x="185" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">300TB Cached Video</text>
    </g>

    <g transform="translate(15, 115)">
      <rect width="330" height="45" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="20" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">🌙 3:00 AM Predictive Push Caching</text>
      <text x="15" y="34" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9">Pre-seeds 4K movies overnight ➔ 98% Local Cache Hit Ratio</text>
    </g>
  </g>

  <!-- Flow Direction Arrows -->
  <text x="320" y="100" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="700">API Manifest</text>
  <text x="790" y="210" fill="#f87171" font-family="'Inter', sans-serif" font-size="10" font-weight="700">3 AM Sync</text>
  <text x="380" y="275" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="800">4K Raw Video Chunks (sendfile)</text>

  <!-- Bottom Legend -->
  <text x="480" y="405" fill="#475569" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Gyaan Ki Baat #13 • By Harshit Joshi • Scalable Edge Video Streaming Architecture</text>
</svg>
